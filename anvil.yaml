scheduled_tasks: []
dependencies: []
services:
- source: /runtime/services/tables.yml
  client_config: {}
  server_config: {}
- source: /runtime/services/anvil/files.yml
  client_config: {}
  server_config: {file_table: files}
- source: /runtime/services/anvil/users.yml
  client_config: {allow_signup: true, enable_automatically: true, use_email: true,
    confirm_email: true, allow_remember_me: false, remember_me_days: 30}
  server_config: {user_table: users}
startup: {type: form, module: ScanCheck}
package_name: Scan_Compare
allow_embedding: false
name: ScanCompare
runtime_options:
  version: 2
  client_version: '3'
  server_version: python3-sandbox
  server_spec: {base: python310-minimal}
startup_form: null
db_schema:
  scans:
    title: scans
    client: none
    server: full
    columns:
    - name: scan_1
      admin_ui: {width: 200}
      type: string
    - name: scan_2
      admin_ui: {width: 200}
      type: string
    - name: scan_3
      admin_ui: {width: 200}
      type: string
    - name: scan_4
      admin_ui: {width: 200}
      type: string
    - name: result
      admin_ui: {width: 200}
      type: string
    - name: created
      admin_ui: {width: 200}
      type: datetime
    - name: user_scan
      admin_ui: {order: 6, width: 200}
      type: string
    - name: user_unblock
      admin_ui: {order: 7, width: 200}
      type: string
  files:
    title: Files
    client: none
    server: full
    columns:
    - name: path
      admin_ui: {width: 200}
      type: string
    - name: file
      admin_ui: {width: 200}
      type: media
    - name: file_version
      admin_ui: {width: 200}
      type: string
  users:
    title: Users
    client: none
    server: full
    columns:
    - name: email
      admin_ui: {width: 200}
      type: string
    - name: enabled
      admin_ui: {width: 200}
      type: bool
    - name: last_login
      admin_ui: {width: 200}
      type: datetime
    - name: password_hash
      admin_ui: {width: 200}
      type: string
    - name: n_password_failures
      admin_ui: {width: 200}
      type: number
    - name: confirmed_email
      admin_ui: {width: 200}
      type: bool
    - name: signed_up
      admin_ui: {width: 200}
      type: datetime
    - name: remembered_logins
      admin_ui: {width: 200}
      type: simpleObject
    - name: email_confirmation_key
      admin_ui: {width: 200}
      type: string
  session_scan:
    client: none
    server: full
    columns:
    - name: result
      admin_ui: {order: 2, width: 200}
      type: string
    - name: valid_scans
      admin_ui: {order: 2, width: 200}
      type: number
    - name: index
      admin_ui: {order: 2, width: 200}
      type: number
    title: session_scan
renamed: true
