scheduled_tasks: []
dependencies: []
services:
- source: /runtime/services/tables.yml
  client_config: {}
  server_config: {}
- source: /runtime/services/anvil/files.yml
  client_config: {}
  server_config: {file_table: files}
- source: /runtime/services/anvil/users.yml
  client_config: {allow_signup: false, enable_automatically: true, use_email: true,
    confirm_email: true}
  server_config: {user_table: users}
startup: {type: form, module: ScanCheck}
package_name: Scan_Compare
allow_embedding: false
name: ScanCompare
runtime_options:
  version: 2
  client_version: '3'
  server_version: python3-sandbox
  server_spec: {base: python310-minimal}
startup_form: null
db_schema:
  scans:
    client: none
    server: full
    columns:
    - name: scan_1
      admin_ui: {order: 0, width: 200}
      type: string
    - name: scan_2
      admin_ui: {order: 1, width: 200}
      type: string
    - name: created
      admin_ui: {order: 2, width: 200}
      type: datetime
    - name: result
      admin_ui: {order: 3, width: 200}
      type: string
    - name: scan_3
      admin_ui: {order: 4, width: 200}
      type: string
    - name: scan_4
      admin_ui: {order: 5, width: 200}
      type: string
    title: scans
  files:
    client: none
    server: full
    columns:
    - name: path
      type: string
      admin_ui: {order: 0, width: 200}
    - name: file
      type: media
      admin_ui: {order: 1, width: 200}
    - name: file_version
      type: string
      admin_ui: {order: 2, width: 200}
    title: Files
  users:
    client: none
    server: full
    columns:
    - name: email
      type: string
      admin_ui: {order: 0, width: 200}
    - name: enabled
      type: bool
      admin_ui: {order: 1, width: 200}
    - name: last_login
      type: datetime
      admin_ui: {order: 2, width: 200}
    - name: password_hash
      type: string
      admin_ui: {order: 3, width: 200}
    - name: n_password_failures
      type: number
      admin_ui: {order: 4, width: 200}
    title: Users
renamed: true
