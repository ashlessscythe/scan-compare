      visible: true
      font_size: null
      font: ''
      spacing_above: small
      spacing_below: small
      italic: false
      background: ''
      bold: false
      underline: false
      include_placeholder: true
    name: drop_down_frontpage
    layout_properties: {grid_position: 'NNDHYA,VWTOKS'}
