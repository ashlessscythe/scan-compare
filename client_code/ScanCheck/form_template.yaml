is_package: true
container:
  type: HtmlTemplate
  properties: {html: '@theme:standard-page.html'}
components:
- type: ColumnPanel
  properties: {col_widths: '{}'}
  name: content_panel
  layout_properties: {slot: default}
  components:
  - type: Label
    properties: {role: headline, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: Scan Verification, font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: large, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: label_1
    layout_properties: {grid_position: 'QAUFQT,RTORBY'}
  - type: Spacer
    properties: {height: 35}
    name: spacer_1
    layout_properties: {grid_position: 'YHAGME,EBIUGV'}
  - type: Label
    properties: {role: display, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: Scan 1, font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: scan_one_label
    layout_properties: {grid_position: 'IEFOXI,KDHKBL'}
    event_bindings: {show: scan_one_label_show}
  - type: Label
    properties: {role: display, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: Scan 2, font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: scan_2_label
    layout_properties: {grid_position: 'IEFOXI,SWEXYT'}
  - type: TextBox
    properties: {}
    name: text_box_1
    layout_properties: {grid_position: 'KQGHGO,MGGVIV'}
    event_bindings: {pressed_enter: text_box_1_pressed_enter}
  - type: TextBox
    properties: {}
    name: text_box_2
    layout_properties: {grid_position: 'KQGHGO,IRQIVZ'}
    event_bindings: {focus: text_box_2_focus, pressed_enter: text_box_2_pressed_enter}
  - type: Button
    properties: {role: tonal-button, align: center, tooltip: '', border: '', enabled: true,
      foreground: '', visible: true, text: Reset, font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: button_reset
    layout_properties: {grid_position: 'NQYNIS,LAHMWH'}
    event_bindings: {click: button_reset_click}
  - type: Button
    properties: {role: filled-button, align: center, tooltip: '', border: '', enabled: true,
      foreground: '', visible: true, text: Compare, font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: button_compare
    layout_properties: {grid_position: 'NQYNIS,XSOBSQ'}
    event_bindings: {click: button_compare_click}
- type: FlowPanel
  properties: {}
  name: navbar_links
  layout_properties: {slot: nav-right}
